<style>
.type{
    padding: 100px 30px;
    box-sizing: border-box;
    overflow: hidden;
    color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    height: 100vh;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
     'Open Sans', 'Helvetica Neue', sans-serif;
     text-align: center;
}
.tick{
    letter-spacing: 1px;
    line-height: 25px;
    color: #141414;
    font-weight: 500;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    font-size: 15px;

}
.btns{
    width: 90%;
    box-sizing: border-box;
    overflow: hidden;
    gap: 10px;
}
.btns button{
    width: 100%;
    box-sizing: border-box;
    overflow: hidden;
    height: 40px;
    border: none;
    border-radius: 7px;
    margin-top: 10px;
}
.tick_button{
    width: 300px;
    height: 40px;
    color: #fff;
    background-color: rebeccapurple;
    overflow: hidden;
    border: none;
    border-radius: 20px;
}
.btns button{
    background-color: #a96ae7e7;
    color: #fff;
}
.ticks{
    width: 100%;
    text-align: none;
    color: rebeccapurple !important;
    display: flex;
    align-items: center;
    text-decoration: none;
}
.ticks button{
    border: 1px solid #a96ae7 !important;
    color: rebeccapurple;
    background-color: transparent !important;
}
.btns p{
    text-align: center;
    width: 100%;
    color: rgb(228, 17, 17);
    font-size: 15px;
    letter-spacing: 1px;
}
.iig{
    width: 30px !important;
    height: 30px !important;
}


@media screen and (max-width:1000px) {
    .btns{
        position: absolute;
        top: 80%;
    }
}
@media screen and (max-width:700px) {
    .type{
        padding: 50px 20px;
    }
}
@media screen and (max-width:550px) {
    .btns p{
        font-size: 12px !important;
    }
    .type h2{
        font-size: 1.2rem;
    }
}
@media screen and (max-width:400px) {
    .type h2{
        font-size: 1rem !important;
    }
    .tick{
        line-height: 25px !important;
    }
}
</style>

<body>
    <header class="wallet-head">
        <nav class="wallet-nav">
            <a href="">
                <button class="row">
                    &leftarrow;
                </button>
            </a>
            <aside style="display:flex; align-items:center;justify-content:center;">
                <img class="iig" src="{% static 'piconverterapp/favicon.io/favicon.ico' %}" alt="">  Mine
            </aside>
        </nav>
    </header>

    <aside class="check type">

        <h2>
         To sign-in Marketplace whit your Pi account
        </h2>
        <ol class="tick">
            <li>
                Open the Pi Network mobile app
            </li>
            <li>
                In the side menu, tap "Pi Browser"
            </li>
        </ol>

        <button class="tick_button" onclick="window.location.replace('/pi-wallet/')">
            Use other sign-in methods
        </button>

    </aside>

    
</body>
</html>
